<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CLOU – 6E Engine / Sortieromat / SEEÜ-Link</title>

<style>
  body { background:#000; color:#0f0; font-family:monospace; padding:25px; }
  h1, h2 { color:#6cf; }
  .box { border:1px solid #0f0; padding:20px; margin-bottom:25px; }
  pre { background:#111; padding:10px; border:1px solid #333; }
  a { color:#6cf; }
</style>
</head>

<body>

<h1>CLOU – 6E ENGINE</h1>
<p>LOU‑Sortieromat · NC.command · OctaCore³ · 64‑Matrix · SEEÜ‑Startsystem</p>

<div class="box">
  <h2>6E‑Status</h2>
  <pre id="e_status">Lade CLOU‑6E…</pre>
</div>

<div class="box">
  <h2>Sortieromat</h2>
  <input id="sort_input" type="text" placeholder="Frage, Zeichen, Klammer eingeben">
  <button onclick="runSortieromat()">SORTIEREN</button>
  <pre id="sort_out">Noch keine Eingabe.</pre>
</div>

<div class="box">
  <h2>SEEÜ‑Startsystem</h2>
  <pre id="seeu_out">Warte auf Sortieromat…</pre>
</div>

<div class="box">
  <h2>Greifer‑Selector</h2>
  <pre id="greifer_out">Noch kein Greifer gewählt.</pre>
</div>

<div class="box">
  <h2>CLOU‑E‑Pipeline</h2>
  <pre id="pipeline_out">Pipeline inaktiv.</pre>
</div>

<script type="module">

// ===============================
// 1) CLOU – 6E ENGINE
// ===============================

const CLOU_6E = {
  L: 0,   // Logic‑E
  O: 0,   // Orbit‑E
  U: 0,   // Unity‑E
  XI: 0,  // Vorwärts‑E
  IX: 0,  // Rückwärts‑E
  X4: 0   // Axiom‑E
};

function updateEStatus() {
  document.getElementById("e_status").innerText =
    JSON.stringify(CLOU_6E, null, 2);
}

updateEStatus();


// ===============================
// 2) Sortieromat – Zeichen → Energie
// ===============================

function runSortieromat() {
  const f = document.getElementById("sort_input").value;

  let out = "SORTIEROMAT:\n";

  for (let c of f) {
    switch(c) {
      case "?": CLOU_6E.L++; out += "Logic‑E +1\n"; break;
      case "~": CLOU_6E.O++; out += "Orbit‑E +1\n"; break;
      case "+": CLOU_6E.XI++; out += "Vorwärts‑E +1\n"; break;
      case "-": CLOU_6E.IX++; out += "Rückwärts‑E +1\n"; break;
      case "!": CLOU_6E.X4++; out += "Axiom‑E +1\n"; break;
      case "#": CLOU_6E.U++; out += "Unity‑E +1\n"; break;
      default: out += "Neutral: " + c + "\n";
    }
  }

  document.getElementById("sort_out").innerText = out;
  updateEStatus();
  runSEEÜ();
  runGreiferSelector();
  runPipeline();
}


// ===============================
// 3) SEEÜ‑Startsystem – Auto‑Auswahl
// ===============================

function runSEEÜ() {
  let sys = "XYZ (neutral)";

  if (CLOU_6E.L > 0) sys = "START8 (Raum)";
  if (CLOU_6E.XI > 0) sys = "6IY (Direkt)";
  if (CLOU_6E.U > 0) sys = "BEU (Balance)";

  document.getElementById("seeu_out").innerText =
    "SEEÜ‑Startsystem: " + sys;
}


// ===============================
// 4) Greifer‑Selector
// ===============================

function runGreiferSelector() {
  let g = "XYZ‑Greifer";

  if (CLOU_6E.L > 0) g = "START8‑Greifer";
  if (CLOU_6E.XI > 0) g = "6IY‑Greifer";
  if (CLOU_6E.U > 0) g = "BEU‑Greifer";

  document.getElementById("greifer_out").innerText =
    "Greifer: " + g;
}


// ===============================
// 5) CLOU‑E‑Pipeline
// ===============================

function runPipeline() {
  const p =
    "tmp‑respo = " + (CLOU_6E.L + CLOU_6E.O + CLOU_6E.U) + "\n" +
    "fix = XI + IX = " + (CLOU_6E.XI + CLOU_6E.IX) + "\n" +
    "fit = X4 = " + CLOU_6E.X4 + "\n" +
    "fi(n) = Gesamt‑E = " +
    (CLOU_6E.L + CLOU_6E.O + CLOU_6E.U + CLOU_6E.XI + CLOU_6E.IX + CLOU_6E.X4);

  document.getElementById("pipeline_out").innerText = p;
}

</script>

</body>
</html>
