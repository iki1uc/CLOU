<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>CLOU — ROOT Engine</title>

<style>
  body { background:#111; color:#0f0; font-family:Consolas; padding:20px; }
  .box { border:1px solid #0f0; padding:20px; width:360px; margin-bottom:20px; }
  .title { color:#6cf; font-size:18px; margin-bottom:10px; }
  canvas { background:#000; display:block; margin:20px auto; }
</style>
</head>

<body>

<h2>CLOU — ROOT Engine</h2>

<div class="box">
  <div class="title">System‑Impulse</div>
  <div>CPU: <span id="cpu">–</span></div>
  <div>GPU: <span id="gpu">–</span></div>
  <div>RAM: <span id="ram">–</span></div>
  <div>ROM: <span id="rom">–</span></div>
</div>

<div class="box">
  <div class="title">ROOT‑Status</div>
  <div>ID: iki1uc</div>
  <div>VERSION: 1.0</div>
  <div>CODE: RAW</div>
  <div>LAGE: ROOT / Creator / NC</div>
  <div>STATUS: Online</div>
</div>

<canvas id="root" width="900" height="600"></canvas>

<script>
// ------------------------------------------------------
// CLOU — Impuls‑Generator
// ------------------------------------------------------

function rand(max) {
  return Math.floor(Math.random() * max);
}

function CPU() { return rand(100); }
function GPU() { return rand(100); }
function RAM() { return rand(100); }
function ROM() { return rand(100); }

// ------------------------------------------------------
// ROOT‑Avatar
// ------------------------------------------------------

const ctx = document.getElementById("root").getContext("2d");
let t = 0;

function drawAvatar(cpu, gpu, ram, rom) {
  ctx.clearRect(0,0,900,600);

  for (let i = 0; i < 180; i++) {
    const fade = Math.sin(t + i * 0.02);
    if (fade < 0.2) continue;

    const x = 450 + Math.sin(t + i * 0.01) * (cpu + 50);
    const y = 300 + Math.cos(t + i * 0.01) * (gpu + 50);

    ctx.fillStyle = `rgba(${ram*2}, ${rom*2}, 255, ${fade})`;
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ------------------------------------------------------
// CLOU — Engine Loop
// ------------------------------------------------------

function CLOU_ENGINE() {
  t += 0.01;

  const cpu = CPU();
  const gpu = GPU();
  const ram = RAM();
  const rom = ROM();

  document.getElementById("cpu").innerText = cpu;
  document.getElementById("gpu").innerText = gpu;
  document.getElementById("ram").innerText = ram;
  document.getElementById("rom").innerText = rom;

  drawAvatar(cpu, gpu, ram, rom);

  requestAnimationFrame(CLOU_ENGINE);
}

CLOU_ENGINE();
</script>

</body>
</html>
